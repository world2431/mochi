<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨池</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1410;--gold:#b8a080;--paper:#e8e0d5;--dim:rgba(255,255,255,.35)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);font-family:'ZCOOL XiaoWei','STKaiti','KaiTi','PingFang SC',serif;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}

/* 水墨背景 */
.ink-bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.ink-splash{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(30,20,12,.08) 0%,rgba(30,20,12,.03) 40%,transparent 70%);animation:inkSpread 20s ease-in-out infinite}
.ink-splash:nth-child(1){width:600px;height:600px;top:-20%;left:-10%;animation-delay:0s}
.ink-splash:nth-child(2){width:500px;height:400px;bottom:-15%;right:-8%;animation-delay:-7s}
.ink-splash:nth-child(3){width:400px;height:500px;top:30%;right:-15%;animation-delay:-14s}
.ink-splash:nth-child(4){width:300px;height:300px;top:50%;left:20%;animation-delay:-3s}
@keyframes inkSpread{0%,100%{transform:scale(1) translate(0,0);opacity:.6}50%{transform:scale(1.3) translate(30px,-20px);opacity:.3}}

/* 墨点 */
.ink-dot{position:absolute;background:radial-gradient(circle,rgba(20,15,8,.15) 0%,rgba(20,15,8,.05) 50%,transparent 70%);border-radius:50%;animation:dotFloat 12s ease-in-out infinite}
.ink-dot:nth-child(5){width:120px;height:80px;top:15%;left:60%;animation-delay:-2s}
.ink-dot:nth-child(6){width:90px;height:60px;top:70%;left:25%;animation-delay:-8s}
.ink-dot:nth-child(7){width:100px;height:70px;bottom:20%;right:30%;animation-delay:-5s}
@keyframes dotFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(15px,-10px) scale(1.2)}}

/* 墨迹线条 */
.ink-line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(20,15,8,.08),transparent);animation:lineDrift 15s ease-in-out infinite}
.ink-line:nth-child(8){width:300px;top:25%;left:10%;animation-delay:0s}
.ink-line:nth-child(9){width:200px;top:60%;right:15%;animation-delay:-6s}
@keyframes lineDrift{0%,100%{opacity:.3;transform:translateX(0)}50%{opacity:.6;transform:translateX(40px)}}

/* 主卡片 */
.login-card{position:relative;z-index:1;background:rgba(250,248,244,.85);backdrop-filter:blur(12px);border:1px solid rgba(180,160,130,.2);border-radius:24px;padding:48px 40px 36px;width:380px;text-align:center;box-shadow:0 8px 60px rgba(0,0,0,.06),0 0 0 1px rgba(180,160,130,.1)}
/* 印章装饰 */
.login-card::before{content:'墨';position:absolute;top:-18px;right:24px;width:42px;height:42px;border:2px solid rgba(200,80,60,.5);border-radius:50%;color:rgba(200,80,60,.6);font-size:20px;display:flex;align-items:center;justify-content:center;font-family:'Ma Shan Zheng',cursive;transform:rotate(15deg)}

/* 标题 */
.title-wrap{margin-bottom:20px}
.title{font-family:'Ma Shan Zheng',cursive;font-size:72px;color:var(--ink);line-height:1;letter-spacing:12px;text-shadow:2px 2px 0 rgba(0,0,0,.08),0 0 30px rgba(0,0,0,.04)}
.subtitle{font-size:13px;color:rgba(0,0,0,.25);letter-spacing:4px;margin-top:2px}

/* 表单 */
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:11px;color:rgba(0,0,0,.3);letter-spacing:2px;margin-bottom:4px}
.form-group input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(180,160,130,.25);background:rgba(255,255,255,.6);color:var(--ink);font-size:14px;font-family:inherit;letter-spacing:1px;transition:all .3s}
.form-group input:focus{outline:none;border-color:rgba(180,140,100,.5);background:rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(180,160,130,.06)}
.form-group input::placeholder{color:rgba(0,0,0,.15)}

.btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--ink);color:var(--paper);font-size:14px;cursor:pointer;letter-spacing:4px;font-family:inherit;transition:all .3s;margin-top:4px}
.btn:hover{background:#2a2018;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.btn-reg{border:1px solid rgba(180,160,130,.3);background:transparent;color:rgba(0,0,0,.4);margin-top:8px;font-size:12px;letter-spacing:2px}
.btn-reg:hover{background:rgba(180,160,130,.08);color:rgba(0,0,0,.6)}

.msg{font-size:11px;color:rgba(200,80,60,.7);margin-top:8px;letter-spacing:1px;min-height:16px}
</style>
</head>
<body>
<div class="ink-bg">
  <div class="ink-splash"></div><div class="ink-splash"></div><div class="ink-splash"></div><div class="ink-splash"></div>
  <div class="ink-dot"></div><div class="ink-dot"></div><div class="ink-dot"></div>
  <div class="ink-line"></div><div class="ink-line"></div>
</div>

<div class="login-card" id="loginCard">
  <div class="title-wrap"><div class="title">墨 池</div><div class="subtitle">AI 写 作 工 坊</div></div>
  <div class="form-group"><label>笔 名</label><input id="nickname" placeholder="取一个名字吧" maxlength="12"></div>
  <div class="form-group"><label>密 码</label><input id="password" type="password" placeholder="至少4位" maxlength="20"></div>
  <div id="confirmGroup" class="form-group" style="display:none"><label>确认密码</label><input id="confirmPw" type="password" placeholder="再输入一次" maxlength="20"></div>
  <button class="btn" id="btnLogin" onclick="handleLogin()">入 池</button>
  <button class="btn btn-reg" id="btnToggle" onclick="toggleMode()">还没有账号？点此注册</button>
  <div class="msg" id="msg"></div>
</div>

<script>
let mode='login'; // login | register
function toggleMode(){
  mode=mode==='login'?'register':'login';
  document.getElementById('confirmGroup').style.display=mode==='register'?'block':'none';
  document.getElementById('btnLogin').textContent=mode==='login'?'入 池':'注 册';
  document.getElementById('btnToggle').textContent=mode==='login'?'还没有账号？点此注册':'已有账号？点此登录';
  document.getElementById('msg').textContent='';
}
function handleLogin(){
  const nick=document.getElementById('nickname').value.trim();const pw=document.getElementById('password').value.trim();
  if(!nick||!pw){document.getElementById('msg').textContent='请填写笔名和密码';return}
  if(pw.length<4){document.getElementById('msg').textContent='密码至少4位';return}
  const users=JSON.parse(localStorage.getItem('mochi_users')||'{}');
  if(mode==='register'){
    if(users[nick]){document.getElementById('msg').textContent='此笔名已被占用';return}
    const cpw=document.getElementById('confirmPw').value.trim();
    if(pw!==cpw){document.getElementById('msg').textContent='两次密码不一致';return}
    users[nick]=pw;localStorage.setItem('mochi_users',JSON.stringify(users));
    document.getElementById('msg').textContent='';document.getElementById('msg').style.color='rgba(100,160,100,.7)';document.getElementById('msg').textContent='注册成功，请登录';mode='login';toggleMode();return;
  }
  // 登录
  if(!users[nick]){document.getElementById('msg').textContent='笔名不存在，请先注册';return}
  if(users[nick]!==pw){document.getElementById('msg').textContent='密码错误';return}
  localStorage.setItem('mochi_user',nick);window.location.href='home.html';
}
// 回车登录
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
document.getElementById('confirmPw').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
</script>
</body>
</html>
