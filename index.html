<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨池</title>
<style>
:root{--ink:#1a1410;--gold:#b8a080;--paper:#e8e0d5;--dim:rgba(255,255,255,.35)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);font-family:'STKaiti','KaiTi','STSong','SimSun',serif;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}

/* 水墨山水背景 Canvas */
#inkPainting{position:fixed;inset:0;pointer-events:none;z-index:0;width:100%;height:100%}

/* 主卡片 */
.login-card{position:relative;z-index:1;background:rgba(250,248,244,.85);backdrop-filter:blur(12px);border:1px solid rgba(180,160,130,.2);border-radius:24px;padding:48px 40px 36px;width:380px;text-align:center;box-shadow:0 8px 60px rgba(0,0,0,.06),0 0 0 1px rgba(180,160,130,.1)}
/* 印章装饰 */
.login-card::before{content:'墨';position:absolute;top:-18px;right:24px;width:42px;height:42px;border:2px solid rgba(200,80,60,.5);border-radius:50%;color:rgba(200,80,60,.6);font-size:20px;display:flex;align-items:center;justify-content:center;font-family:'STKaiti','KaiTi',cursive;transform:rotate(15deg)}

/* 标题 */
.title-wrap{margin-bottom:20px}
.title{font-family:'STKaiti','KaiTi',cursive;font-size:72px;color:var(--ink);line-height:1;letter-spacing:12px;text-shadow:2px 2px 0 rgba(0,0,0,.08),0 0 30px rgba(0,0,0,.04)}
.subtitle{font-size:13px;color:rgba(0,0,0,.25);letter-spacing:4px;margin-top:2px}

/* 表单 */
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:11px;color:rgba(0,0,0,.3);letter-spacing:2px;margin-bottom:4px}
.form-group input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(180,160,130,.25);background:rgba(255,255,255,.6);color:var(--ink);font-size:14px;font-family:inherit;letter-spacing:1px;transition:all .3s}
.form-group input:focus{outline:none;border-color:rgba(180,140,100,.5);background:rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(180,160,130,.06)}
.form-group input::placeholder{color:rgba(0,0,0,.15)}

.btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--ink);color:var(--paper);font-size:14px;cursor:pointer;letter-spacing:4px;font-family:inherit;transition:all .3s;margin-top:4px}
.btn:hover{background:#2a2018;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.btn-reg{border:1px solid rgba(180,160,130,.3);background:transparent;color:rgba(0,0,0,.4);margin-top:8px;font-size:12px;letter-spacing:2px}
.btn-reg:hover{background:rgba(180,160,130,.08);color:rgba(0,0,0,.6)}

.msg{font-size:11px;color:rgba(200,80,60,.7);margin-top:8px;letter-spacing:1px;min-height:16px}
</style>
</head>
<body>
<canvas id="inkPainting"></canvas>

<div class="login-card" id="loginCard">
  <div class="title-wrap"><div class="title">墨 池</div><div class="subtitle">AI 写 作 工 坊</div></div>
  <div class="form-group"><label>笔 名</label><input id="nickname" placeholder="取一个名字吧" maxlength="12"></div>
  <div class="form-group"><label>密 码</label><input id="password" type="password" placeholder="至少4位" maxlength="20"></div>
  <div id="confirmGroup" class="form-group" style="display:none"><label>确认密码</label><input id="confirmPw" type="password" placeholder="再输入一次" maxlength="20"></div>
  <button class="btn" id="btnLogin" onclick="handleLogin()">入 池</button>
  <button class="btn btn-reg" id="btnToggle" onclick="toggleMode()">还没有账号？点此注册</button>
  <div class="msg" id="msg"></div>
  <div style="margin-top:16px;font-size:10px;color:rgba(0,0,0,.15);letter-spacing:2px" id="visitorCount">...</div>
</div>

<script>
// ===== 水墨山水画 =====
(function(){const c=document.getElementById('inkPainting'),ctx=c.getContext('2d');let w,h;
function rs(){w=innerWidth;h=innerHeight;c.width=w;c.height=h;drawPainting()}rs();window.addEventListener('resize',rs);

function ink(color,alpha){return color.replace(')',`,${alpha})`).replace('rgb','rgba')}

function drawPainting(){
  ctx.clearRect(0,0,w,h);ctx.fillStyle='#f0ebe0';ctx.fillRect(0,0,w,h);
  const paperGrad=ctx.createRadialGradient(w*.4,h*.3,0,w*.5,h*.5,w);paperGrad.addColorStop(0,'#f5f0e8');paperGrad.addColorStop(1,'#e8e0d5');ctx.fillStyle=paperGrad;ctx.fillRect(0,0,w,h);

  // 淡墨远山(远→近3层)
  [{y:.38,h:.24,a:.04},{y:.42,h:.2,a:.06},{y:.46,h:.18,a:.1}].forEach(({y,h2,a})=>{
    ctx.fillStyle=ink('rgba(40,30,20',a);ctx.beginPath();ctx.moveTo(0,y*h);
    for(let x=0;x<w;x+=w/20){ctx.lineTo(x,(y+Math.sin(x*.003)*h2/2)*h)}ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill()
  });

  // 中景山体(浓墨)
  ctx.fillStyle='rgba(35,28,18,.15)';ctx.beginPath();ctx.moveTo(0,h*.58);
  for(let x=0;x<w;x+=w/30){const peak=.12+Math.sin(x*.002)*.04+Math.sin(x*.005)*.03+Math.sin(x*.008)*.02;ctx.lineTo(x,h*(.58-peak))}ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();

  // 近山(浓)
  ctx.fillStyle='rgba(25,20,12,.2)';ctx.beginPath();ctx.moveTo(0,h*.68);
  for(let x=0;x<w;x+=w/40){const peak=.06+Math.sin(x*.003+1)*.03+Math.sin(x*.007)*.02;ctx.lineTo(x,h*(.68-peak))}ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();

  // 江水
  const waterGrad=ctx.createLinearGradient(0,h*.72,0,h);waterGrad.addColorStop(0,'rgba(180,170,155,.08)');waterGrad.addColorStop(.5,'rgba(180,170,155,.04)');waterGrad.addColorStop(1,'rgba(200,190,175,.06)');ctx.fillStyle=waterGrad;ctx.fillRect(0,h*.72,w,h*.28);
  // 水纹
  ctx.strokeStyle='rgba(160,150,140,.04)';ctx.lineWidth=.5;
  for(let i=0;i<8;i++){ctx.beginPath();const yw=h*(.75+i*.025);for(let x=0;x<w;x+=5){ctx.lineTo(x,yw+Math.sin(x*.004+i)*3)}ctx.stroke()}

  // 竹(左)
  for(let i=0;i<3;i++){const bx=w*(.08+i*.06);ctx.strokeStyle=ink('rgba(30,25,15',.15+i*.03);ctx.lineWidth=2+i*.5;ctx.beginPath();ctx.moveTo(bx,h*.72);ctx.quadraticCurveTo(bx-15,h*.55,bx+5,h*.35+(i*.08));ctx.stroke();
    for(let j=0;j<5;j++){const jy=h*(.38+j*.08);ctx.strokeStyle=ink('rgba(40,35,20',.1);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx+5,jy);ctx.lineTo(bx+20,jy-10);ctx.stroke()}
  }

  // 松(右)
  const tx=w*.85;ctx.strokeStyle='rgba(25,20,12,.2)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tx,h*.72);ctx.quadraticCurveTo(tx-10,h*.5,tx-5,h*.3);ctx.stroke();
  ctx.fillStyle='rgba(25,20,12,.12)';ctx.beginPath();ctx.ellipse(tx-5,h*.32,35,20,-.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(tx-12,h*.38,25,15,-.3,0,Math.PI*2);ctx.fill();

  // 小舟
  ctx.strokeStyle='rgba(30,25,15,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w*.35,h*.78);ctx.quadraticCurveTo(w*.38,h*.76,w*.42,h*.78);ctx.stroke();
  ctx.fillStyle='rgba(30,25,15,.1)';ctx.beginPath();ctx.moveTo(w*.36,h*.78);ctx.lineTo(w*.38,h*.75);ctx.lineTo(w*.41,h*.78);ctx.closePath();ctx.fill();
  // 渔人
  ctx.fillStyle='rgba(25,20,12,.15)';ctx.beginPath();ctx.arc(w*.38,h*.74,4,0,Math.PI*2);ctx.fill();

  // 雾气
  for(let i=0;i<5;i++){const fogGrad=ctx.createLinearGradient(0,h*(.4+i*.06),0,h*(.7+i*.06));fogGrad.addColorStop(0,'rgba(255,255,255,0)');fogGrad.addColorStop(.5,'rgba(255,255,255,.03)');fogGrad.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=fogGrad;ctx.fillRect(0,h*(.4+i*.06),w,h*(.15))}

  // 月亮
  const moonGrad=ctx.createRadialGradient(w*.78,h*.18,5,w*.78,h*.18,40);moonGrad.addColorStop(0,'rgba(255,250,240,.15)');moonGrad.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=moonGrad;ctx.beginPath();ctx.arc(w*.78,h*.18,35,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,250,238,.25)';ctx.beginPath();ctx.arc(w*.78,h*.18,18,0,Math.PI*2);ctx.fill();
}
})();

// ===== 登录逻辑 =====
let mode='login'; // login | register
function toggleMode(){
  mode=mode==='login'?'register':'login';
  document.getElementById('confirmGroup').style.display=mode==='register'?'block':'none';
  document.getElementById('btnLogin').textContent=mode==='login'?'入 池':'注 册';
  document.getElementById('btnToggle').textContent=mode==='login'?'还没有账号？点此注册':'已有账号？点此登录';
  document.getElementById('msg').textContent='';
}
function handleLogin(){
  const nick=document.getElementById('nickname').value.trim();const pw=document.getElementById('password').value.trim();
  if(!nick||!pw){document.getElementById('msg').textContent='请填写笔名和密码';return}
  if(pw.length<4){document.getElementById('msg').textContent='密码至少4位';return}
  const users=JSON.parse(localStorage.getItem('mochi_users')||'{}');
  if(mode==='register'){
    if(users[nick]){document.getElementById('msg').textContent='此笔名已被占用';return}
    const cpw=document.getElementById('confirmPw').value.trim();
    if(pw!==cpw){document.getElementById('msg').textContent='两次密码不一致';return}
    users[nick]=pw;localStorage.setItem('mochi_users',JSON.stringify(users));
    document.getElementById('msg').textContent='';document.getElementById('msg').style.color='rgba(100,160,100,.7)';document.getElementById('msg').textContent='注册成功，请登录';mode='login';toggleMode();return;
  }
  // 登录
  if(!users[nick]){document.getElementById('msg').textContent='笔名不存在，请先注册';return}
  if(users[nick]!==pw){document.getElementById('msg').textContent='密码错误';return}
  localStorage.setItem('mochi_user',nick);window.location.href='home.html';
}
// 访问计数
(async()=>{try{const r=await fetch('https://api.countapi.xyz/hit/mochi-writer/visits');const d=await r.json();document.getElementById('visitorCount').textContent='🌐 第 '+d.value+' 位访客'}catch(e){document.getElementById('visitorCount').textContent=''}})();
// 回车登录
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
document.getElementById('confirmPw').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
</script>
</body>
</html>
