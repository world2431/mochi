<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>关系网</title>
<style>*{margin:0;padding:0}body{background:#0f1117;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif}canvas{display:block}#info{position:fixed;bottom:20px;left:0;width:100%;text-align:center;color:rgba(255,255,255,.2);font-size:11px;letter-spacing:2px;pointer-events:none}#back{position:fixed;top:16px;left:16px;z-index:5;padding:8px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(15,17,23,.8);color:rgba(255,255,255,.5);font-size:11px;cursor:pointer;letter-spacing:1px;font-family:inherit;transition:all .3s}#back:hover{color:#fff;border-color:rgba(255,255,255,.3)}</style>
</head>
<body>
<button id="back" onclick="history.back()">← 返回</button>
<div id="info">拖拽节点 · 滚轮缩放</div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=window.innerWidth,H=window.innerHeight,scale=1,offsetX=0,offsetY=0,dragging=null,lastX,lastY;
canvas.width=W;canvas.height=H;

// 读数据
const params=new URLSearchParams(location.search);
const characters=JSON.parse(localStorage.getItem('w_characters')||'[]');

// 如果没有角色数据，创建示例数据方便测试
if(characters.length===0){
  characters.push(
    {id:'demo1',name:'主角',gender:'男',desc:'少年剑客',relations:[{target:'师父',desc:'师徒'},{target:'青梅',desc:'恋人'},{target:'反派',desc:'宿敌'}],timeline:[]},
    {id:'demo2',name:'师父',gender:'男',desc:'隐世高手',relations:[],timeline:[]},
    {id:'demo3',name:'青梅',gender:'女',desc:'邻家少女',relations:[],timeline:[]},
    {id:'demo4',name:'反派',gender:'男',desc:'魔教教主',relations:[],timeline:[]}
  );
  localStorage.setItem('w_characters',JSON.stringify(characters));
}

// 找中心角色（没有指定则用demo）
const centerId2=params.get('id')||'demo1';
let center=characters.find(c=>c.id===centerId2);
if(!center)center=characters[0];
if(!center){document.body.innerHTML='<div style="color:#fff;text-align:center;padding:40px">角色不存在</div>';throw new Error('no center')}
if(!center.relations||center.relations.length===0){document.body.innerHTML=`<div style="color:#fff;text-align:center;padding:40px"><div style="font-size:60px">🔗</div><h2>${center.name}</h2><p style="color:rgba(255,255,255,.4)">暂无关系，先去角色库添加</p><button onclick="history.back()" style="margin-top:16px;padding:10px 24px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;cursor:pointer;font-family:inherit">返回</button></div>`;throw new Error('no rel')}

// 构建节点：中心 + 所有被关联的
const nodes=[],nodeMap={};
function avatarColor(name){let h=0;for(let i=0;i<name.length;i++)h+=name.charCodeAt(i);return `hsl(${h%360},55%,45%)`}
function initials(name){return name.slice(0,2)}

// 中心节点
nodes.push({id:center.id,name:center.name,gender:center.gender,x:W/2,y:H/2,vx:0,vy:0,fixed:true,isCenter:true,color:avatarColor(center.name)});
nodeMap[center.id]=nodes[0];

// 遍历关系，添加被关联角色（库里找，找不到也创建）
(center.relations||[]).forEach(r=>{
  const target=characters.find(c=>c.name===r.target);
  const rid=target?target.id:'rel_'+r.target;
  if(!nodeMap[rid]){
    const angle=Math.random()*Math.PI*2,dist=200+Math.random()*150;
    const name=target?target.name:r.target;
    const gender=target?target.gender||'?':'?';
    const node={id:rid,name,gender,x:W/2+Math.cos(angle)*dist,y:H/2+Math.sin(angle)*dist,vx:0,vy:0,color:avatarColor(name)};
    nodes.push(node);nodeMap[rid]=node;
  }
});

// 构建连线
const links=[];
(center.relations||[]).forEach(r=>{
  const target=characters.find(c=>c.name===r.target);
  if(target&&nodeMap[target.id]){
    links.push({from:nodeMap[center.id],to:nodeMap[target.id],label:r.desc});
  }
});

// 力导向物理
function simulate(){
  nodes.forEach(n=>{if(!n.fixed){n.vx*=.9;n.vy*=.9;n.x+=n.vx;n.y+=n.vy}});
  // 排斥力
  for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];const dx=b.x-a.x,dy=b.y-a.y,dist=Math.max(1,Math.sqrt(dx*dx+dy*dy));if(dist<180){const force=.3*(180-dist)/dist;a.vx-=dx*force;a.vy-=dy*force;b.vx+=dx*force;b.vy+=dy*force}}}
  // 弹簧力（连线）
  links.forEach(l=>{const dx=l.to.x-l.from.x,dy=l.to.y-l.from.y,dist=Math.max(1,Math.sqrt(dx*dx+dy*dy));const target=180;const force=.01*(dist-target)/dist;l.from.vx+=dx*force;l.from.vy+=dy*force;l.to.vx-=dx*force;l.to.vy-=dy*force});
  // 中心引力
  nodes.forEach(n=>{if(!n.fixed){const dx=W/2-n.x,dy=H/2-n.y,dist=Math.max(1,Math.sqrt(dx*dx+dy*dy));n.vx+=dx*.0008;n.vy+=dy*.0008}});
}

// 渲染
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);
  // 连线
  links.forEach(l=>{
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(l.from.x,l.from.y);ctx.lineTo(l.to.x,l.to.y);ctx.stroke();
    // 标签
    const mx=(l.from.x+l.to.x)/2,my=(l.from.y+l.to.y)/2;ctx.fillStyle='rgba(212,168,84,.6)';ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(l.label,mx,my-6);
  });
  // 节点
  nodes.forEach(n=>{
    const r=n.isCenter?38:28;
    // 光晕
    const glow=ctx.createRadialGradient(n.x,n.y,r*.4,n.x,n.y,r*1.8);glow.addColorStop(0,n.color.replace(')',',.3)').replace('hsl','hsla'));glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(n.x,n.y,r*1.8,0,Math.PI*2);ctx.fill();
    // 圆圈
    ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.stroke();
    // 头像文字
    ctx.fillStyle='#fff';ctx.font=`${r*.7}px "PingFang SC","Microsoft YaHei",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(initials(n.name),n.x,n.y);
    // 名字
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText(n.name,n.x,n.y+r+16);
    // 性别标签
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText(n.gender,n.x,n.y+r+30);
  });
  ctx.restore();
}

function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;nodes[0].x=W/2;nodes[0].y=H/2}resize();window.addEventListener('resize',resize);

// 交互
canvas.addEventListener('mousedown',e=>{
  const mx=(e.clientX-offsetX)/scale,my=(e.clientY-offsetY)/scale;
  const hit=nodes.find(n=>Math.hypot(mx-n.x,my-n.y)<(n.isCenter?38:28));
  if(hit&&!hit.fixed){dragging=hit;lastX=mx;lastY=my}
});canvas.addEventListener('mousemove',e=>{if(dragging){const mx=(e.clientX-offsetX)/scale,my=(e.clientY-offsetY)/scale;dragging.x=mx;dragging.y=my}});
canvas.addEventListener('mouseup',()=>{dragging=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();scale*=e.deltaY>0?.9:1.1;scale=Math.max(.3,Math.min(3,scale))});

function loop(){for(let i=0;i<3;i++)simulate();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
