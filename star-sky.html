<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星空灵感</title>
<style>
*{margin:0;padding:0}body{background:#05080f;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
canvas{display:block}#back{position:fixed;top:12px;left:12px;z-index:5;padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(5,8,15,.8);color:rgba(255,255,255,.4);font-size:11px;cursor:pointer;letter-spacing:1px;font-family:inherit}#back:hover{color:#fff}
#count{position:fixed;top:14px;right:16px;z-index:5;color:rgba(255,255,255,.25);font-size:11px;letter-spacing:2px;pointer-events:none}
#popup{position:fixed;z-index:10;background:rgba(10,14,25,.95);border:1px solid rgba(200,180,255,.15);border-radius:14px;padding:16px;width:260px;display:none;backdrop-filter:blur(8px)}
#popup .star-text{color:rgba(255,255,255,.7);font-size:12px;line-height:1.8;margin:8px 0;max-height:150px;overflow-y:auto}
#popup .star-date{color:rgba(255,255,255,.2);font-size:10px;margin-top:6px}
</style>
</head>
<body>
<button id="back" onclick="history.back()">← 星瓶</button>
<div id="count">0 颗星</div>
<div id="popup"><div class="star-text"></div><div class="star-date"></div></div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight;canvas.width=W;canvas.height=H;
let panX=0,panStart=0,panStartX=0,panning=false,brushStar=null;

// 加载灵感数据
const items=JSON.parse(localStorage.getItem('starBottles')||'[]');
// 如果没数据，创建示例用于预览
// 不覆盖用户数据 — 如果为空就显示提示文字
const totalWidth=Math.max(W*2,items.length*100+300);
document.getElementById('count').textContent=items.length+' 颗星';

// 为每个灵感生成星星位置
const stars=items.map((item,i)=>({
  x:100+i*80+Math.random()*30,y:60+Math.random()*(H-120),r:2+Math.random()*4,
  phase:Math.random()*Math.PI*2,speed:.5+Math.random()*1.5,
  color:['#e8d8ff','#ffd8e0','#d8e8ff','#ffe8c0','#c0ffe8','#ffc0e8','#fff8d8'][Math.floor(Math.random()*7)],
  text:item.text,date:item.date
}));
// 背景恒星（非灵感星）
const bgStars=[];for(let i=0;i<120;i++){bgStars.push({x:Math.random()*totalWidth,y:Math.random()*H,r:.5+Math.random()*1.2,phase:Math.random()*Math.PI*2,speed:.3+Math.random()*.8,color:'rgba(200,200,230,.3)'})}

// 流星
let shootingStar={x:0,y:0,life:0,timer:5+Math.random()*15};

function draw(){
  ctx.clearRect(0,0,W,H);
  // 夜空渐变
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#03060f');bg.addColorStop(.5,'#060b18');bg.addColorStop(1,'#0a0f20');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // 银河带
  ctx.fillStyle='rgba(40,30,80,.03)';ctx.beginPath();for(let x=0;x<W;x+=4){ctx.lineTo(x,H*.4+Math.sin(x*.003)*H*.3)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  const t=Date.now()*.001;
  // 背景星
  bgStars.forEach(s=>{const sx=s.x+panX;if(sx<-10||sx>W+10)return;const tw=.3+.7*Math.sin(t*s.speed+s.phase);ctx.fillStyle=s.color.replace('0.3',(tw*.3).toFixed(2));ctx.beginPath();ctx.arc(sx,s.y,s.r,0,Math.PI*2);ctx.fill()});
  // 灵感星
  stars.forEach((s,i)=>{
    const sx=s.x+panX;if(sx<-10||sx>W+10)return;
    const tw=.5+.5*Math.sin(t*s.speed+s.phase);
    // 光晕
    const glow=ctx.createRadialGradient(sx,s.y,0,sx,s.y,s.r*3);glow.addColorStop(0,s.color.replace(')',`,${.3+tw*.2})`).replace('rgb','rgba'));glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sx,s.y,s.r*3,0,Math.PI*2);ctx.fill();
    // 星体
    ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(sx,s.y,s.r*(.8+tw*.4),0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,s.y,s.r*.3,0,Math.PI*2);ctx.fill();
    // 十字光芒
    if(tw>.7){ctx.strokeStyle=`rgba(255,255,255,${(tw-.7)*.4})`;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(sx-s.r*2,s.y);ctx.lineTo(sx+s.r*2,s.y);ctx.moveTo(sx,s.y-s.r*2);ctx.lineTo(sx,s.y+s.r*2);ctx.stroke()}
    // 悬浮高亮
    if(brushStar===i){ctx.strokeStyle='rgba(255,240,200,.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sx,s.y,s.r+6,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillText(s.text.slice(0,15)+'…',sx,ctx.measureText('…').width>0?s.y+s.r+10:s.y+s.r+10)}
  });

  // 流星
  shootingStar.timer-=1/60;if(shootingStar.timer<=0){shootingStar={x:Math.random()*W,y:Math.random()*H*.5,life:1,vx:2+Math.random()*3,vy:1+Math.random()*2,timer:8+Math.random()*20}}
  if(shootingStar.life>0){shootingStar.life-=.02;shootingStar.x+=shootingStar.vx;shootingStar.y+=shootingStar.vy;const trail=ctx.createLinearGradient(shootingStar.x,shootingStar.y,shootingStar.x-shootingStar.vx*30,shootingStar.y-shootingStar.vy*30);trail.addColorStop(0,'rgba(255,255,255,.8)');trail.addColorStop(1,'rgba(0,0,0,0)');ctx.strokeStyle=trail;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(shootingStar.x,shootingStar.y);ctx.lineTo(shootingStar.x-shootingStar.vx*30,shootingStar.y-shootingStar.vy*30);ctx.stroke()}
}

canvas.addEventListener('mousemove',e=>{const mx=e.clientX-panX;brushStar=null;stars.forEach((s,i)=>{if(Math.abs(mx-s.x)<15&&Math.abs(e.clientY-s.y)<15)brushStar=i})});
canvas.addEventListener('click',e=>{const i=brushStar;if(i!=null){const pop=document.getElementById('popup');pop.querySelector('.star-text').textContent=stars[i].text;pop.querySelector('.star-date').textContent=stars[i].date;pop.style.display='block';pop.style.left=Math.min(e.clientX,W-280)+'px';pop.style.top=Math.min(e.clientY,H-180)+'px'}else{document.getElementById('popup').style.display='none'}});
canvas.addEventListener('mousedown',e=>{panning=true;panStart=e.clientX;panStartX=panX});
canvas.addEventListener('mousemove',e=>{if(panning)panX=panStartX+(e.clientX-panStart)});
canvas.addEventListener('mouseup',()=>{panning=false});
// 触控
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];panning=true;panStart=t.clientX;panStartX=panX});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(panning){const t=e.touches[0];panX=panStartX+(t.clientX-panStart)}});
canvas.addEventListener('touchend',e=>{panning=false;const i=brushStar;if(i!=null){const pop=document.getElementById('popup');pop.querySelector('.star-text').textContent=stars[i].text;pop.querySelector('.star-date').textContent=stars[i].date;pop.style.display='block';pop.style.left=Math.min(e.changedTouches[0].clientX,W-280)+'px';pop.style.top=Math.min(e.changedTouches[0].clientY,H-180)+'px'}else{document.getElementById('popup').style.display='none'}});

window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H});
function loop(){draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
