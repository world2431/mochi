<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes"><title>时光小河</title>
<style>*{margin:0;padding:0}body{background:#0d1a1a;font-family:'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;top:0;left:0}#back{position:fixed;top:10px;left:10px;z-index:5;padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(13,26,26,.8);color:rgba(255,255,255,.5);font-size:11px;cursor:pointer;letter-spacing:1px;font-family:inherit;text-decoration:none}
#back:hover{color:#fff}#tools{position:fixed;top:10px;right:10px;z-index:5;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tb{padding:5px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(13,26,26,.8);color:rgba(255,255,255,.4);font-size:10px;cursor:pointer;letter-spacing:1px;font-family:inherit}.tb:hover{color:#fff;border-color:rgba(255,255,255,.3)}.tb.act{color:#8cd;border-color:rgba(136,204,221,.4)}
#note{position:fixed;z-index:10;background:rgba(20,30,35,.95);border:1px solid rgba(136,204,221,.2);border-radius:14px;padding:14px;width:240px;display:none;backdrop-filter:blur(8px)}
#note input,#note textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);color:#c8d8d8;font-size:11px;font-family:inherit;margin-bottom:6px;resize:vertical}
#note input:focus,#note textarea:focus{outline:none;border-color:rgba(136,204,221,.4)}
#note button{padding:5px 12px;border-radius:8px;border:1px solid rgba(136,204,221,.3);background:rgba(136,204,221,.08);color:#8cd;cursor:pointer;font-size:10px;letter-spacing:1px;font-family:inherit}
#note button.del{border-color:rgba(255,80,80,.3);color:#f66;margin-left:6px}#hint{position:fixed;bottom:12px;left:0;width:100%;text-align:center;color:rgba(255,255,255,.1);font-size:10px;letter-spacing:2px;pointer-events:none}</style>
</head>
<body>
<a href="home.html" id="back">← 返回</a>
<div id="tools">
  <button class="tb" onclick="addRiver()" id="btnRiver">+ 支流</button>
  <button class="tb" onclick="toggleConnect()" id="btnConn">~ 连接</button>
  <button class="tb" onclick="addReverse()">⟲ 回溯</button>
  <button class="tb" onclick="placeItem()" id="btnPlace">+ 鱼石草</button>
</div>
<div id="note"><input id="nDate" placeholder="时间点"><textarea id="nEvent" placeholder="发生了什么…" rows="2"></textarea><button onclick="saveNote()">保存</button><button class="del" onclick="delNote()">删除</button></div>
<div id="hint">双击河中放置 · 拖拽鱼石草上岸丢弃 · 左右拖动平移</div>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W=innerWidth,H=innerHeight;C.width=W;C.height=H;
window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;C.width=W;C.height=H});

// 数据加载
let chars=[],ch={name:'时光',timeline:[]};
try{chars=JSON.parse(localStorage.getItem('w_characters')||'[]');const id=new URLSearchParams(location.search).get('id');ch=chars.find(c=>c.id===id)||chars[0]||ch}catch(e){}
let items=(ch.timeline||[]).map((t,i)=>({x:120+i*140,type:['rock','fish1','fish2','plant'][i%4],date:t.time||'',event:t.event||'',v:i%3}));
if(!items.length)items=[{x:200,type:'rock',date:'开始',event:'故事的起点',v:0},{x:380,type:'fish1',date:'',event:'',v:1},{x:560,type:'plant',date:'',event:'',v:2}];
let rivers=[{id:'r1',y:H*.5,items,direction:1}];
let BRANCH_GAP=Math.min(100,H/5); // 支流间距，不超屏幕1/5
let connections=[],dying=[],panX=0,placeMode=null,connMode=false,connSel=[],drag=null,dragItem=null,dragRiver=null,panning=false,panS=0,panSX=0,activeNote=null,brush=null,hasReverse=false;
const MAX_RIVERS=5;

// 保存
function save(){try{const m=rivers[0];if(m){ch.timeline=m.items.map(i=>({time:i.date,event:i.event}));localStorage.setItem('w_characters',JSON.stringify(chars))}}catch(e){}}

// 绘制
function draw(){
  X.clearRect(0,0,W,H);
  X.fillStyle='#0d1a1a';X.fillRect(0,0,W,H);
  // 星星
  for(let i=0;i<20;i++){X.fillStyle='rgba(180,200,200,.05)';X.beginPath();X.arc((i*137+Date.now()*.01)%W,(i*251)%H,.8,0,7);X.fill()}
  // 连接线
  connSel.forEach(s=>{X.strokeStyle='rgba(255,220,100,.6)';X.lineWidth=2;X.setLineDash([3,3]);X.beginPath();X.arc(s.x+panX,s.y,20,0,7);X.stroke();X.setLineDash([])});
  connections.forEach(c=>{const r1=rivers.find(r=>r.id===c.fr),r2=rivers.find(r=>r.id===c.tr);if(!r1||!r2)return;const i1=r1.items.find(i=>i===c.fi),i2=r2.items.find(i=>i===c.ti);if(!i1||!i2)return;const x1=i1.x+panX,y1=r1.y+Math.sin(i1.x*.008+Date.now()*.0008)*6,x2=i2.x+panX,y2=r2.y+Math.sin(i2.x*.008+Date.now()*.0008)*6;X.strokeStyle='rgba(136,200,210,.25)';X.lineWidth=2;X.setLineDash([5,4]);X.beginPath();if(c.fr===c.tr){const m=(x1+x2)/2,my=Math.min(y1,y2)-55;X.moveTo(x1,y1);X.quadraticCurveTo(x1,my,m,my);X.quadraticCurveTo(x2,my,x2,y2)}else{const m=(x1+x2)/2;X.moveTo(x1,y1);X.bezierCurveTo(m,y1,m,y2,x2,y2)}X.stroke();X.setLineDash([])});

  rivers.forEach(r=>{
    const ry=r.y,rw=r===rivers[0]?48:28;
    X.fillStyle='rgba(25,55,65,.6)';X.beginPath();X.moveTo(0,ry-rw/2);for(let x=0;x<=W;x+=8)X.lineTo(x,ry-rw/2+Math.sin(x*.008+Date.now()*.0008)*5);X.lineTo(W,ry+rw/2);for(let x=W;x>=0;x-=8)X.lineTo(x,ry+rw/2+Math.sin(x*.008+Date.now()*.0008)*5);X.closePath();X.fill();
    X.strokeStyle='rgba(120,180,200,.12)';X.lineWidth=1.5;X.beginPath();for(let x=0;x<W;x+=6)X.lineTo(x,ry+Math.sin(x*.01+Date.now()*.001)*3);X.stroke();
    for(let ax=(60-(panX%180+180)%180)%180;ax<W+100;ax+=180){X.fillStyle='rgba(150,200,210,.2)';X.font='12px sans-serif';X.textAlign='center';X.fillText(r.direction>0?'→':'←',ax,ry-6)}
    X.strokeStyle='rgba(80,130,140,.2)';X.lineWidth=1;X.beginPath();for(let x=0;x<W;x+=6)X.lineTo(x,ry-rw/2+Math.sin(x*.008+Date.now()*.0008)*5);X.stroke();X.beginPath();for(let x=0;x<W;x+=6)X.lineTo(x,ry+rw/2+Math.sin(x*.008+Date.now()*.0008)*5);X.stroke();

    if(!r.items)return;
    r.items.forEach((item,idx)=>{
      if(drag&&dragItem===item)return;
      const ix=item.x+panX,iy=ry+Math.sin(item.x*.008+Date.now()*.0008)*5;
      const v=item.v||0,hover=brush===item;
      if(item.type.startsWith('fish')){
        const sx=12+v*3,sy=6+v*2,colors=['#e89860','#c87840','#f0a870'];X.fillStyle=colors[v];X.beginPath();X.ellipse(ix,iy-4,sx+Math.sin(Date.now()*.004+v)*2,sy,.12,0,7);X.fill();X.fillStyle='#111';X.beginPath();X.arc(ix+sx*.4,iy-6,2,0,7);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(ix+sx*.4+1,iy-7,.6,0,7);X.fill();X.fillStyle='rgba(255,200,150,.5)';X.beginPath();X.moveTo(ix-sx*.3,iy-4);X.lineTo(ix-sx-4,iy-10);X.lineTo(ix-sx-5,iy);X.closePath();X.fill();
      }else if(item.type==='rock'){
        const rx=8+v*4,ry2=5+v*2;X.fillStyle='#556068';X.beginPath();X.ellipse(ix,iy+4,rx,ry2,.3,0,7);X.fill();X.fillStyle='rgba(255,255,255,.06)';X.beginPath();X.ellipse(ix-2,iy+2,rx*.3,ry2*.25,-.2,0,7);X.fill();
      }else if(item.type==='plant'){
        const sw=Math.sin(Date.now()*.003+v)*3;X.strokeStyle=['#5a9460','#4a8450','#68a870'][v];X.lineWidth=2;X.lineCap='round';for(let b=0;b<3+v;b++){X.beginPath();X.moveTo(ix-3+b*5,iy+10);X.quadraticCurveTo(ix-5+b*3+sw,iy-6,ix-1+b*2+sw*1.5,iy-20);X.stroke()}
      }
      if(hover){X.strokeStyle='rgba(255,240,180,.6)';X.lineWidth=2;X.beginPath();X.arc(ix,iy,20,0,7);X.stroke()}
      if(item.date){X.fillStyle='rgba(255,255,255,.25)';X.font='8px sans-serif';X.textAlign='center';X.fillText(item.date,ix,iy+16)}
    });
  });
  dying.forEach((d,i)=>{d.life-=.02;if(d.life>0){X.globalAlpha=d.life;const item=d.item,iy=d.y;const v=item.v||0;if(item.type.startsWith('fish')){X.fillStyle='#ffb8a0';X.beginPath();X.ellipse(d.x,iy-4,14,7,.12,0,7);X.fill()}X.globalAlpha=1}});
  dying=dying.filter(d=>d.life>0);
}

// 交互
function hitTest(mx,my){let h=null;rivers.forEach(r=>{if(r.items)r.items.forEach(item=>{const iy=r.y+Math.sin(item.x*.008+Date.now()*.0008)*5;if(Math.hypot(mx-(item.x+panX),my-iy)<25)h={item,river:r}})})}
C.addEventListener('mousemove',e=>{const mx=e.clientX-panX,my=e.clientY;let h=null;rivers.forEach(r=>{if(r.items)r.items.forEach(item=>{const iy=r.y+Math.sin(item.x*.008+Date.now()*.0008)*5;if(Math.hypot(e.clientX-(item.x+panX),e.clientY-iy)<25)h=item})});brush=h;C.style.cursor=h?'pointer':placeMode?'crosshair':connMode?'crosshair':'grab'});
C.addEventListener('mousedown',e=>{if(e.button===1||(!brush&&!placeMode&&!connMode)){panning=true;panS=e.clientX;panSX=panX;return}if(brush&&!placeMode&&!connMode){drag={};dragItem=brush;rivers.forEach(r=>{if(r.items&&r.items.includes(dragItem))dragRiver=r})}});
C.addEventListener('mousemove',e=>{if(panning)panX=panSX+(e.clientX-panS);if(drag){drag.x=e.clientX-panX;drag.y=e.clientY}});
C.addEventListener('mouseup',e=>{if(drag&&dragItem){const my=e.clientY;let inRv=false;rivers.forEach(r=>{if(my>r.y-40&&my<r.y+40)inRv=true});if(!inRv&&dragRiver){dying.push({item:dragItem,x:drag.x+panX,y:drag.y,life:1});dragRiver.items=dragRiver.items.filter(i=>i!==dragItem);save()}else if(inRv){dragItem.x=drag.x;dragItem.y=0}}drag=null;dragItem=null;dragRiver=null;panning=false});
C.addEventListener('click',e=>{if(panning||drag)return;const mx=e.clientX-panX,my=e.clientY;if(placeMode){let hr=null;rivers.forEach(r=>{if(e.clientY>r.y-40&&e.clientY<r.y+40)hr=r});if(hr){hr.items.push({x:mx,type:placeMode,date:'',event:'',v:Math.floor(Math.random()*3)});save()}placeMode=null;document.getElementById('btnPlace').classList.remove('act');return}if(connMode){let fd=null;rivers.forEach(r=>{if(r.items)r.items.forEach(item=>{const iy=r.y+Math.sin(item.x*.008+Date.now()*.0008)*5;if(Math.hypot(e.clientX-(item.x+panX),e.clientY-iy)<25)fd={x:item.x,y:iy,item,river:r.id}})});if(fd){connSel.push(fd);if(connSel.length>=2){const a=connSel[0],b=connSel[1];connections.push({fr:a.river,fi:a.item,tr:b.river,ti:b.item});connSel=[];connMode=false;document.getElementById('btnConn').classList.remove('act')}}return}let h=null;rivers.forEach(r=>{if(r.items)r.items.forEach(item=>{const iy=r.y+Math.sin(item.x*.008+Date.now()*.0008)*5;if(Math.hypot(e.clientX-(item.x+panX),e.clientY-iy)<25)h={item,river:r,x:e.clientX,y:e.clientY}})});if(h)showNote(h);else hideNote()});
C.addEventListener('dblclick',e=>{if(placeMode||connMode||drag)return;const mx=e.clientX-panX;let hr=null;rivers.forEach(r=>{if(e.clientY>r.y-40&&e.clientY<r.y+40)hr=r});if(hr){const t=['fish1','fish2','rock','plant'][Math.floor(Math.random()*4)];hr.items.push({x:mx,type:t,date:'',event:'',v:Math.floor(Math.random()*3)});save()}});
C.addEventListener('contextmenu',e=>{e.preventDefault();const mx=e.clientX-panX;let h=null;rivers.forEach(r=>{if(r.items)r.items.forEach((item,i)=>{const iy=r.y+Math.sin(item.x*.008+Date.now()*.0008)*5;if(Math.hypot(e.clientX-(item.x+panX),e.clientY-iy)<25)h={item,river:r,idx:i}})});if(h){h.river.items.splice(h.idx,1);save()}});
// 触控
C.addEventListener('touchstart',e=>{const t=e.touches[0];let h=null;rivers.forEach(r=>{if(r.items)r.items.forEach(item=>{const iy=r.y+Math.sin(item.x*.008+Date.now()*.0008)*5;if(Math.hypot(t.clientX-(item.x+panX),t.clientY-iy)<25)h=item})});brush=h;if(!h&&!placeMode&&!connMode){panning=true;panS=t.clientX;panSX=panX}else if(h&&!placeMode&&!connMode){drag={};dragItem=h;rivers.forEach(r=>{if(r.items&&r.items.includes(dragItem))dragRiver=r})}});
C.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];if(panning)panX=panSX+(t.clientX-panS);if(drag){drag.x=t.clientX-panX;drag.y=t.clientY}});
C.addEventListener('touchend',e=>{if(drag&&dragItem){const my=drag.y;let inRv=false;rivers.forEach(r=>{if(my>r.y-40&&my<r.y+40)inRv=true});if(!inRv&&dragRiver){dying.push({item:dragItem,x:drag.x+panX,y:drag.y,life:1});dragRiver.items=dragRiver.items.filter(i=>i!==dragItem);save()}else if(inRv){dragItem.x=drag.x;dragItem.y=0}}drag=null;dragItem=null;dragRiver=null;panning=false});

function showNote(h){const n=document.getElementById('note');n.style.display='block';n.style.left=Math.min(h.x,W-260)+'px';n.style.top=Math.min(h.y,H-170)+'px';document.getElementById('nDate').value=h.item.date||'';document.getElementById('nEvent').value=h.item.event||'';activeNote=h}
function hideNote(){document.getElementById('note').style.display='none';activeNote=null}
function saveNote(){if(!activeNote)return;activeNote.item.date=document.getElementById('nDate').value;activeNote.item.event=document.getElementById('nEvent').value;hideNote();save()}
function delNote(){if(!activeNote)return;activeNote.river.items=activeNote.river.items.filter(i=>i!==activeNote.item);hideNote();save()}

function addRiver(){if(rivers.length>=MAX_RIVERS)return;const l=rivers[rivers.length-1];const ny=Math.min(H-BRANCH_GAP,Math.max(BRANCH_GAP,(l?l.y:0)+BRANCH_GAP));rivers.push({id:'r'+Date.now(),y:ny,items:[],direction:1});updateBtns()}
function toggleConnect(){connMode=!connMode;document.getElementById('btnConn').classList.toggle('act',connMode);connSel=[]}
function addReverse(){if(hasReverse)return;if(rivers.length>=MAX_RIVERS)return;const f=rivers[0];const ny=Math.max(80,(f?f.y:0)-BRANCH_GAP);if(ny<40)return;rivers.unshift({id:'r'+Date.now(),y:ny,items:[],direction:-1});hasReverse=true;updateBtns()}
function updateBtns(){document.getElementById('btnRiver').textContent='+ 支流('+rivers.length+'/'+MAX_RIVERS+')'}
function placeItem(){const t=['fish1','fish2','rock','plant'][Math.floor(Math.random()*4)];placeMode=t;document.getElementById('btnPlace').classList.add('act');document.getElementById('btnPlace').textContent='点河中放置';setTimeout(()=>{if(placeMode){placeMode=null;document.getElementById('btnPlace').classList.remove('act');document.getElementById('btnPlace').textContent='+ 鱼石草'}},5000)}

function loop(){draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
