<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>x3 · 斜坡滑道</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
canvas{display:block}
#info{position:absolute;bottom:20px;left:0;width:100%;text-align:center;pointer-events:none;z-index:2;color:rgba(255,255,255,.18);font-size:11px;letter-spacing:2px}
</style>
</head>
<body>
<div id="info">x3 · 固定斜坡 — 球从高处自然滚落，触底自动复位</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38,1,0.1,30);
camera.position.set(2,3.5,7);
camera.lookAt(0,0.2,0);

const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.2,0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 2.5; controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI*0.5;
controls.update();

// 光照
const envCanvas = document.createElement('canvas');
envCanvas.width=1024;envCanvas.height=512;
const ectx=envCanvas.getContext('2d');
const sky=ectx.createLinearGradient(0,0,0,340);
sky.addColorStop(0,'#7eb8da');sky.addColorStop(0.4,'#b8d4ea');sky.addColorStop(0.7,'#dde6ee');sky.addColorStop(0.95,'#eaedee');sky.addColorStop(1,'#e4e4dc');
ectx.fillStyle=sky;ectx.fillRect(0,0,1024,512);
const grd=ectx.createLinearGradient(0,370,0,512);
grd.addColorStop(0,'#e6e6e0');grd.addColorStop(0.4,'#ededeb');grd.addColorStop(1,'#f0f0ee');
ectx.fillStyle=grd;ectx.fillRect(0,385,1024,127);
const envTex=new THREE.CanvasTexture(envCanvas);
envTex.mapping=THREE.EquirectangularReflectionMapping;envTex.colorSpace=THREE.SRGBColorSpace;
scene.environment=envTex;scene.environmentIntensity=0.55;

const sun=new THREE.DirectionalLight(0xfff6ed,6);
sun.position.set(4.5,8,2.5);sun.castShadow=true;
sun.shadow.mapSize.width=2048;sun.shadow.mapSize.height=2048;
sun.shadow.camera.near=0.3;sun.shadow.camera.far=28;
sun.shadow.camera.left=-6;sun.shadow.camera.right=6;
sun.shadow.camera.top=4;sun.shadow.camera.bottom=-4;
sun.shadow.bias=-0.00005;sun.shadow.normalBias=0.04;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xccddff,0xe0d8cc,0.45));

// 平台容器
const PLATFORM_W=1.35,PLATFORM_D=4.5,BALL_R=0.45;
const EDGE_X=PLATFORM_W-BALL_R-0.05,EDGE_Z=PLATFORM_D-BALL_R-0.05;
const RAMP_ANGLE=0.35; // 约20°陡坡

const platformGroup=new THREE.Group();
platformGroup.rotation.x = RAMP_ANGLE; // 固定前倾
scene.add(platformGroup);

const platformGeo=new THREE.BoxGeometry(PLATFORM_W*2,0.12,PLATFORM_D*2);
const platformCanvas=document.createElement('canvas');
platformCanvas.width=256;platformCanvas.height=256;
const pctx=platformCanvas.getContext('2d');
pctx.fillStyle='#e8e8e3';pctx.fillRect(0,0,256,256);
for(let i=0;i<800;i++){const v=225+Math.random()*30;pctx.fillStyle=`rgb(${v},${v},${v})`;pctx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,1+Math.random()*2)}
const platformTex=new THREE.CanvasTexture(platformCanvas);
const platformMat=new THREE.MeshStandardMaterial({map:platformTex,color:0xe6e6e0,roughness:0.48,metalness:0.01});
const platformMesh=new THREE.Mesh(platformGeo,platformMat);
platformMesh.position.y=-0.06;platformMesh.receiveShadow=true;
platformGroup.add(platformMesh);

// 边框
const edgeGeo=new THREE.BoxGeometry(PLATFORM_W*2+0.15,0.04,0.08);
const edgeMat=new THREE.MeshStandardMaterial({color:0x555555,roughness:0.5,metalness:0.4});
['front','back','left','right'].forEach(pos=>{
  const edge=new THREE.Mesh(edgeGeo,edgeMat);
  if(pos==='front'){edge.position.set(0,0,PLATFORM_D)}
  if(pos==='back'){edge.position.set(0,0,-PLATFORM_D)}
  if(pos==='left'){edge.rotation.y=Math.PI/2;edge.position.set(-PLATFORM_W,0,0)}
  if(pos==='right'){edge.rotation.y=Math.PI/2;edge.position.set(PLATFORM_W,0,0)}
  platformGroup.add(edge);
});

// 玻璃球
const ballGeo=new THREE.SphereGeometry(BALL_R,256,256);
const ballMat=new THREE.MeshPhysicalMaterial({
  color:0xf8fcff,metalness:0,roughness:0.08,ior:1.45,
  transmission:0.88,thickness:1.4,
  specularIntensity:0.9,specularColor:new THREE.Color(0xffffff),
  attenuationColor:new THREE.Color(0xccddff),attenuationDistance:1.6,
  clearcoat:0.03,clearcoatRoughness:0.05,envMapIntensity:0.55
});
const ball=new THREE.Mesh(ballGeo,ballMat);
ball.position.set(0,0.5,-EDGE_Z); // 从高处出发
ball.castShadow=true;ball.receiveShadow=true;
platformGroup.add(ball);

// 焦散
const causticCanvas=document.createElement('canvas');
causticCanvas.width=256;causticCanvas.height=256;
const cctx=causticCanvas.getContext('2d');
const hues=[0,30,60,120,180,240,300];
hues.forEach(h=>{
  const r=40+Math.random()*60,a=Math.random()*Math.PI*2;
  const x=128+Math.cos(a)*r,y=128+Math.sin(a)*r*0.6;
  const grad=cctx.createRadialGradient(x,y,0,x,y,30+Math.random()*30);
  grad.addColorStop(0,`hsla(${h},60%,75%,0.12)`);grad.addColorStop(0.5,`hsla(${h},45%,65%,0.04)`);grad.addColorStop(1,'rgba(0,0,0,0)');
  cctx.fillStyle=grad;cctx.beginPath();cctx.arc(x,y,35+Math.random()*25,0,Math.PI*2);cctx.fill();
});
const causticTex=new THREE.CanvasTexture(causticCanvas);
const causticPlane=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.4),new THREE.MeshBasicMaterial({map:causticTex,transparent:true,opacity:0.25,depthWrite:false,blending:THREE.AdditiveBlending}));
causticPlane.rotation.x=-Math.PI/2;causticPlane.position.y=0.003;causticPlane.renderOrder=2;
platformGroup.add(causticPlane);

// 物理状态
let ballVx=0,ballVz=0;
const GRAVITY=12,FRICTION=0.999,BALL_FORCE=3.5;

function resetBall(){ball.position.set(0,0.5,-EDGE_Z);ballVx=0;ballVz=0}

// 键盘
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key]=false;e.preventDefault()});

function updatePhysics(dt){
  // 斜面重力（球自动向下滚）
  const slopeAccel = GRAVITY * Math.sin(RAMP_ANGLE);
  ballVz += slopeAccel * dt;

  // 左右控制
  if(keys['ArrowLeft'])  ballVx -= BALL_FORCE * dt;
  if(keys['ArrowRight']) ballVx += BALL_FORCE * dt;
  // 下坡加速
  if(keys['ArrowDown'])  ballVz += BALL_FORCE * 0.8 * dt;
  // 上坡弱力（斜面重力会抵消大部分）
  if(keys['ArrowUp'])    ballVz -= BALL_FORCE * 0.35 * dt;

  // 斜坡无摩擦，持续加速
  ball.position.x += ballVx*dt; ball.position.z += ballVz*dt;

  if(Math.abs(ball.position.x)>EDGE_X){ball.position.x=Math.sign(ball.position.x)*EDGE_X;ballVx*=-0.3}
  if(Math.abs(ball.position.z)>EDGE_Z){
    if(ball.position.z<-EDGE_Z) resetBall();
    else {ball.position.z=Math.sign(ball.position.z)*EDGE_Z;ballVz*=-0.3}
  }
  ball.position.y=0.5;
  causticPlane.position.x=ball.position.x;causticPlane.position.z=ball.position.z;
  ball.rotation.x+=ballVz*dt*1.5;ball.rotation.z-=ballVx*dt*1.5;
}

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  updatePhysics(dt);
  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
