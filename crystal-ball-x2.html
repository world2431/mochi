const platformGeo=new THREE.BoxGeometry(PLATFORM_W*2,.12,PLATFORM_D*2);const platCanvas=document.createElement('canvas');platCanvas.width=256;platCanvas.height=256;const pctx=platCanvas.getContext('2d');pctx.fillStyle='#e8e8e3';pctx.fillRect(0,0,256,256);for(let i=0;i<800;i++){const v=225+Math.random()*30;pctx.fillStyle=`rgb(${v},${v},${v})`;pctx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,1+Math.random()*2)}const platTex=new THREE.CanvasTexture(platCanvas);const platMat=new THREE.MeshStandardMaterial({map:platTex,color:0xe6e6e0,roughness:.48,metalness:.01});const platMesh=new THREE.Mesh(platformGeo,platMat);platMesh.position.y=-.06;platMesh.receiveShadow=true;platformGroup.add(platMesh);

let bvx=0,bvz=0;const G=12,F=.95,FORCE=4,MAX_TILT=.25,EDGE_BOUNCE=.3;

  if(keys['ArrowUp'])bvz-=FORCE*dt;if(keys['ArrowDown'])bvz+=FORCE*dt;if(keys['ArrowLeft'])bvx-=FORCE*dt;if(keys['ArrowRight'])bvx+=FORCE*dt;if(keys['r']||keys['R']){ball.position.set(0,.5,0);bvx=0;bvz=0}
