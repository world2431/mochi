<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星瓶 · 灵感收容所</title>
<style>
:root{--bg:#0d1117;--gold:#d4a854;--glass:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#c8c8d0;font-family:'PingFang SC','Microsoft YaHei',serif;height:100vh;overflow:hidden;user-select:none}
/* 星空 */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.9;transform:scale(1.5)}}
.shooting{position:absolute;width:2px;height:2px;background:#fff;animation:shoot 4s linear infinite;opacity:0}
.shooting::after{content:'';position:absolute;top:50%;transform:translateY(-50%);width:60px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.6),transparent)}
@keyframes shoot{0%{opacity:0;transform:translate(0,0)}5%{opacity:1}15%{opacity:0;transform:translate(250px,180px)}100%{opacity:0;transform:translate(250px,180px)}}
/* 麻绳 */
.rope{position:fixed;top:0;width:3px;z-index:2;pointer-events:none;background:linear-gradient(180deg,#8b7355 40%,transparent 100%)}
.rope-left{left:calc(18% - 1.5px);height:50%}.rope-right{right:calc(18% - 1.5px);height:50%}
/* 星瓶 */
.bottle{position:fixed;z-index:3;cursor:pointer;transition:all .8s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;justify-content:center}
.bottle-body{position:relative;width:64px;height:84px;background:var(--glass);border:1.5px solid rgba(255,255,255,.12);border-radius:22px 22px 16px 16px;backdrop-filter:blur(8px);box-shadow:inset 0 0 30px rgba(200,180,255,.04),0 0 20px rgba(180,160,255,.06);transition:all .3s}
.bottle:hover .bottle-body{box-shadow:inset 0 0 40px rgba(200,180,255,.1),0 0 30px rgba(180,160,255,.15);border-color:rgba(255,255,255,.2)}
.bottle-neck{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:22px;height:18px;border:1.5px solid rgba(255,255,255,.12);border-bottom:none;border-radius:8px 8px 0 0;background:var(--glass)}
.bottle-cork{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:16px;height:10px;background:linear-gradient(180deg,#c49a6c,#8b6914);border-radius:4px 4px 2px 2px}
.star-inside{font-size:28px;pointer-events:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);animation:float 3s ease-in-out infinite}
.star-inside.multi{font-size:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;width:100%}
@keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-4px)}}
.bottle-left{top:44%;left:calc(18% - 32px)}.bottle-right{top:44%;right:calc(18% - 32px)}
/* 绳子连接到瓶 */
.bottle::after{content:'';position:absolute;top:-60px;left:50%;width:1.5px;height:60px;background:#8b7355;opacity:.4;transform:translateX(-50%)}

/* 闪烁 */
.bottle-right.flashing{animation:flashBottle .5s ease-out}
@keyframes flashBottle{0%{filter:brightness(2)}50%{filter:brightness(1.5);transform:scale(1.2)}100%{filter:brightness(1);transform:scale(1)}}

/* 标签 */
.bottle-label{position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:11px;letter-spacing:2px;white-space:nowrap;pointer-events:none}
.bottle-label.left{transform:translateX(-50%)}.bottle-label.right{transform:translateX(-50%)}

/* 灵感输入区 */
#inspire-zone{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;opacity:0;pointer-events:none;transition:all .4s}
#inspire-zone.show{opacity:1;pointer-events:all}
#inspire-zone textarea{width:360px;height:160px;background:rgba(20,16,30,.9);border:1.5px solid rgba(200,180,255,.15);border-radius:18px;color:#d0c8e8;padding:20px;font-size:14px;line-height:1.8;resize:none;font-family:inherit;letter-spacing:.5px;backdrop-filter:blur(12px);transition:all .4s}
#inspire-zone textarea:focus{outline:none;border-color:rgba(200,180,255,.4);box-shadow:0 0 40px rgba(180,150,255,.1)}
#inspire-zone .btn-row{margin-top:10px;display:flex;gap:8px;justify-content:center}
#inspire-zone button{padding:8px 22px;border-radius:18px;border:1px solid rgba(200,180,255,.2);background:rgba(20,16,30,.6);color:rgba(200,180,240,.5);font-size:11px;cursor:pointer;letter-spacing:2px;transition:all .3s;font-family:inherit}
#inspire-zone button:hover{background:rgba(200,180,255,.1);color:#d0c0f0;border-color:rgba(200,180,255,.4)}
/* 遮罩 */
#overlay{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.4);display:none}#overlay.show{display:block}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="shooting" style="top:15%;left:25%;animation-delay:3s"></div>
<div class="shooting" style="top:22%;left:55%;animation-delay:10s"></div>

<!-- 绳 -->
<div class="rope rope-left"></div><div class="rope rope-right"></div>

<!-- 左瓶——记录 -->
<div class="bottle bottle-left" id="bottleLeft" onclick="openInspire()">
  <div class="bottle-cork"></div><div class="bottle-neck"></div>
  <div class="bottle-body"><span class="star-inside">⭐</span></div>
  <div class="bottle-label left">点 击 记 录</div>
</div>

<!-- 右瓶——星空 -->
<div class="bottle bottle-right" id="bottleRight" onclick="openSky()">
  <div class="bottle-cork"></div><div class="bottle-neck"></div>
  <div class="bottle-body"><span class="star-inside">🌟</span></div>
  <div class="bottle-label right">封 存 星 空</div>
</div>

<div id="overlay" onclick="closeInspire()"></div>
<div id="inspire-zone">
  <textarea id="inspireText" placeholder="捕捉此刻的灵感…"></textarea>
  <div class="btn-row">
    <button onclick="saveInspire()">✦ 封 存</button>
    <button onclick="closeInspire()">关 闭</button>
  </div>
</div>

<script>
// 星空
const starsEl=document.getElementById('stars');
for(let i=0;i<100;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*70}%;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;--d:${2+Math.random()*4}s;--dl:${Math.random()*4}s`;starsEl.appendChild(s)}
// 流星
for(let i=0;i<3;i++){const m=document.createElement('div');m.className='shooting';m.style.cssText=`top:${8+Math.random()*30}%;left:${10+Math.random()*70}%;animation-delay:${Math.random()*15}s`;starsEl.appendChild(m)}

function openInspire(){
  document.getElementById('inspire-zone').classList.add('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('inspireText').focus();
}
function closeInspire(){
  document.getElementById('inspire-zone').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}
function saveInspire(){
  const text=document.getElementById('inspireText').value.trim();if(!text)return;
  const item={text,date:new Date().toLocaleString('zh-CN')};
  let sealed=JSON.parse(localStorage.getItem('starBottles')||'[]');sealed.unshift(item);localStorage.setItem('starBottles',JSON.stringify(sealed));
  document.getElementById('inspireText').value='';closeInspire();
  // 右瓶闪烁
  const rb=document.getElementById('bottleRight');rb.classList.add('flashing');setTimeout(()=>rb.classList.remove('flashing'),500);
  // 更新标签
  updateCount();
}
function openSky(){window.location.href='star-sky.html'}
function updateCount(){
  const n=(JSON.parse(localStorage.getItem('starBottles')||'[]')).length;
  document.querySelector('.bottle-label.right').textContent=n>0?n+' 颗星':'封 存 星 空';
  // 右瓶星星数量
  const rb=document.getElementById('bottleRight');
  const starEl=rb.querySelector('.star-inside');
  const stars=['⭐','🌟','✨','💫'];
  if(n===0){starEl.textContent='🌟';starEl.className='star-inside'}
  else if(n<=4){starEl.textContent=stars.slice(0,n).join('');starEl.className='star-inside multi'}
  else{starEl.textContent='✨✨✨✨✨';starEl.className='star-inside multi'}
}
updateCount();
</script>
</body>
</html>
