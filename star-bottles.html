<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星瓶 · 灵感收容所</title>
<style>
:root{--bg:#0d1117;--rope:#8b7355;--gold:#d4a854;--glass:rgba(255,255,255,.06);--text:#c8c8d0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',serif;min-height:100vh;overflow:hidden;user-select:none}
/* 星空 */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.9;transform:scale(1.5)}}
/* 流星 */
.shooting{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:shoot 3s linear infinite;opacity:0}
.shooting::after{content:'';position:absolute;top:50%;transform:translateY(-50%);width:60px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.6),transparent)}
@keyframes shoot{0%{opacity:0;transform:translate(0,0)}5%{opacity:1}15%{opacity:0;transform:translate(300px,200px)}100%{opacity:0;transform:translate(300px,200px)}}

/* 麻绳 */
.rope{position:fixed;top:0;width:3px;z-index:2;pointer-events:none}
.rope::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,var(--rope) 60%,transparent 100%);opacity:.7}
.rope-left{left:18%;height:55%}
.rope-right{right:18%;height:55%}
.rope-handle{position:fixed;top:52%;z-index:3;cursor:grab;padding:16px 24px;font-size:13px;color:var(--gold);letter-spacing:3px;transition:all .3s;text-shadow:0 0 12px rgba(212,168,84,.3)}
.rope-handle:hover{color:#f0d080;text-shadow:0 0 20px rgba(212,168,84,.6);transform:scale(1.05)}
.rope-handle:active{cursor:grabbing}
.handle-left{left:calc(18% - 60px)}
.handle-right{right:calc(18% - 60px)}

/* 星瓶 */
.bottle{position:fixed;z-index:4;pointer-events:none;transition:all .8s cubic-bezier(.34,1.56,.64,1)}
.bottle-body{position:relative;width:60px;height:80px;background:var(--glass);border:1.5px solid rgba(255,255,255,.15);border-radius:20px 20px 16px 16px;backdrop-filter:blur(8px);box-shadow:inset 0 0 30px rgba(200,180,255,.05),0 0 20px rgba(180,160,255,.08)}
.bottle-neck{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:22px;height:20px;border:1.5px solid rgba(255,255,255,.15);border-bottom:none;border-radius:8px 8px 0 0;background:var(--glass)}
.bottle-cork{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:16px;height:10px;background:linear-gradient(180deg,#c49a6c,#8b6914);border-radius:4px 4px 2px 2px}
.star-inside{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-6px)}}
.bottle-left{top:44%;left:calc(18% - 30px);transform:translateY(-20px)}
.bottle-right{top:44%;right:calc(18% - 30px);transform:translateY(-20px)}
/* 绳子连接瓶 */
.bottle::before{content:'';position:absolute;top:-90px;left:50%;width:1.5px;height:100px;background:var(--rope);opacity:.5}

/* 中间灵感区 */
#inspire-zone{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;opacity:0;transition:all .6s;pointer-events:none}
#inspire-zone.show{opacity:1;pointer-events:all}
#inspire-zone textarea{width:380px;height:180px;background:rgba(20,16,30,.85);border:1.5px solid rgba(200,180,255,.2);border-radius:20px;color:#d0c8e8;padding:24px;font-size:15px;line-height:1.8;resize:none;font-family:inherit;letter-spacing:.5px;backdrop-filter:blur(12px);transition:all .4s}
#inspire-zone textarea:focus{outline:none;border-color:rgba(200,180,255,.5);box-shadow:0 0 40px rgba(180,150,255,.1)}
#inspire-zone .btn-row{margin-top:12px;display:flex;gap:10px;justify-content:center}
#inspire-zone button{padding:8px 22px;border-radius:20px;border:1px solid rgba(200,180,255,.25);background:rgba(20,16,30,.6);color:rgba(200,180,240,.6);font-size:12px;cursor:pointer;letter-spacing:2px;transition:all .3s;font-family:inherit;backdrop-filter:blur(8px)}
#inspire-zone button:hover{background:rgba(200,180,255,.1);color:#d0c0f0;border-color:rgba(200,180,255,.5)}

/* 右侧封存区 */
#sealed-zone{position:fixed;top:50%;right:calc(18% - 40px);transform:translateY(-50%);z-index:5;opacity:0;transition:all .6s;pointer-events:none;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto}
#sealed-zone.show{opacity:1;pointer-events:all}
.sealed-card{background:rgba(20,16,30,.7);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 16px;color:rgba(255,255,255,.4);font-size:12px;letter-spacing:1px;width:200px;backdrop-filter:blur(8px);position:relative;transition:all .3s}
.sealed-card:hover{background:rgba(30,24,40,.8);border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.6)}
.sealed-card .card-star{position:absolute;top:-12px;right:12px;font-size:18px}
.sealed-card .card-date{font-size:10px;color:rgba(255,255,255,.2);margin-top:4px}

/* 标题 */
#title{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:6;font-size:18px;letter-spacing:6px;color:rgba(255,255,255,.35);pointer-events:none}

/* 瓶子拖拽时的状态 */
.bottle.dropping{animation:bottleDrop 1.2s cubic-bezier(.22,0,.36,1) forwards}
@keyframes bottleDrop{0%{transform:translateY(-20px)}40%{transform:translateY(40vh)}60%{transform:translateY(38vh)}80%{transform:translateY(40vh)}100%{transform:translateY(38vh)}}
.bottle.sealing{animation:bottleSeal 1s ease forwards}
@keyframes bottleSeal{0%{transform:translateY(0) scale(1);opacity:1}50%{transform:translateY(-30px) scale(1.1);opacity:.8}100%{transform:translateY(-60px) scale(.9);opacity:.4}}
</style>
</head>
<body>
<!-- 星空 -->
<div class="stars" id="stars"></div>
<!-- 流星 -->
<div class="shooting" style="top:15%;left:30%;animation-delay:2s"></div>
<div class="shooting" style="top:25%;left:60%;animation-delay:8s"></div>

<!-- 标题 -->
<div id="title">✦ 灵 感 收 容 所 ✦</div>

<!-- 左麻绳 -->
<div class="rope rope-left"></div>
<div class="rope-handle handle-left" id="handleLeft">✦ 拉 动 记 录</div>

<!-- 右麻绳 -->
<div class="rope rope-right"></div>
<div class="rope-handle handle-right" id="handleRight">封 存 ✦</div>

<!-- 左星瓶 -->
<div class="bottle bottle-left" id="bottleLeft">
  <div class="bottle-cork"></div><div class="bottle-neck"></div>
  <div class="bottle-body"><div class="star-inside">⭐</div></div>
</div>

<!-- 右星瓶 -->
<div class="bottle bottle-right" id="bottleRight">
  <div class="bottle-cork"></div><div class="bottle-neck"></div>
  <div class="bottle-body"><div class="star-inside">🌟</div></div>
</div>

<!-- 灵感输入区 -->
<div id="inspire-zone">
  <textarea id="inspireText" placeholder="捕捉此刻的灵感…"></textarea>
  <div class="btn-row">
    <button id="btnSave">✦ 收 藏</button>
    <button id="btnClose">关 闭</button>
  </div>
</div>

<!-- 封存区 -->
<div id="sealed-zone"></div>

<script>
// 星空生成
const starsEl=document.getElementById('stars');
for(let i=0;i<120;i++){
  const s=document.createElement('div');s.className='star';
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*70}%;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;--d:${2+Math.random()*4}s;--dl:${Math.random()*4}s`;
  starsEl.appendChild(s);
}
// 流星
for(let i=0;i<3;i++){
  const m=document.createElement('div');m.className='shooting';
  m.style.cssText=`top:${10+Math.random()*30}%;left:${10+Math.random()*70}%;animation-delay:${Math.random()*12}s`;
  starsEl.appendChild(m);
}

// 左绳——拉下星瓶记录灵感
const handleLeft=document.getElementById('handleLeft'),bottleLeft=document.getElementById('bottleLeft');
const inspireZone=document.getElementById('inspire-zone'),inspireText=document.getElementById('inspireText');
const sealedZone=document.getElementById('sealed-zone');

let leftPulled=false;
handleLeft.addEventListener('click',()=>{
  if(leftPulled){
    // 收回去
    bottleLeft.classList.remove('dropping');bottleLeft.style.transform='translateY(-20px)';
    inspireZone.classList.remove('show');leftPulled=false;handleLeft.textContent='✦ 拉 动 记 录';
  }else{
    bottleLeft.classList.add('dropping');bottleLeft.style.transform='translateY(38vh)';
    setTimeout(()=>{inspireZone.classList.add('show')},600);
    leftPulled=true;handleLeft.textContent='✦ 收 回';
  }
});

// 收藏灵感
document.getElementById('btnSave').addEventListener('click',()=>{
  const text=inspireText.value.trim();if(!text)return;
  const item={text,date:new Date().toLocaleString('zh-CN')};
  let sealed=JSON.parse(localStorage.getItem('starBottles')||'[]');sealed.unshift(item);localStorage.setItem('starBottles',JSON.stringify(sealed));
  inspireText.value='';renderSealed();inspireZone.classList.remove('show');
  bottleLeft.classList.remove('dropping');bottleLeft.style.transform='translateY(-20px)';
  leftPulled=false;handleLeft.textContent='✦ 拉 动 记 录';
  // 右瓶闪一下
  bottleRight.style.transform='scale(1.3)';setTimeout(()=>bottleRight.style.transform='translateY(-20px)',300);
});
document.getElementById('btnClose').addEventListener('click',()=>{
  inspireZone.classList.remove('show');bottleLeft.classList.remove('dropping');
  bottleLeft.style.transform='translateY(-20px)';leftPulled=false;handleLeft.textContent='✦ 拉 动 记 录';
});

// 右绳——封存区
const handleRight=document.getElementById('handleRight'),bottleRight=document.getElementById('bottleRight');
let rightPulled=false;
handleRight.addEventListener('click',()=>{
  if(rightPulled){
    bottleRight.classList.remove('sealing');bottleRight.style.transform='translateY(-20px)';
    sealedZone.classList.remove('show');rightPulled=false;handleRight.textContent='封 存 ✦';
  }else{
    bottleRight.classList.add('sealing');bottleRight.style.transform='translateY(-60px)';
    setTimeout(()=>{sealedZone.classList.add('show')},500);
    rightPulled=true;handleRight.textContent='关 闭 ✦';
  }
});

function renderSealed(){
  const items=JSON.parse(localStorage.getItem('starBottles')||'[]');
  sealedZone.innerHTML=items.slice(0,10).map((it,i)=>`<div class="sealed-card"><span class="card-star">${['⭐','🌟','✨','💫','🌙'][i%5]}</span>${it.text.slice(0,60)}${it.text.length>60?'…':''}<div class="card-date">${it.date}</div></div>`).join('');
}
renderSealed();
</script>
</body>
</html>
